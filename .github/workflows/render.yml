
name: Render Jakarta Low-Poly 3D Animation (1080x1920)

on:
  workflow_dispatch:
    inputs:
      render_engine:
        description: 'Blender Render Engine'
        required: false
        default: 'BLENDER_EEVEE_NEXT'
      samples:
        description: 'Render samples per frame'
        required: false
        default: '8'

permissions:
  contents: read
  actions: read

jobs:
  render-video:
    name: Render Group ${{ matrix.chunk }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - chunk: 1
            scenes: "scene_01,scene_02"
          - chunk: 2
            scenes: "scene_03,scene_04"
          - chunk: 3
            scenes: "scene_05,scene_06"
          - chunk: 4
            scenes: "scene_07,scene_08"
          - chunk: 5
            scenes: "scene_09,scene_10"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libegl1 libgl1 libgbm1 libgles2 \
            libxi6 libxrender1 libxkbcommon0 \
            libsm6 libice6 libglib2.0-0 libgomp1 \
            fonts-dejavu-core wget xz-utils

      - name: Install Blender 4.2.3
        run: |
          wget -q https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf blender-4.2.3-linux-x64.tar.xz
          sudo mv blender-4.2.3-linux-x64 /opt/blender
          sudo ln -sf /opt/blender/blender /usr/local/bin/blender
          blender --version

      - name: Prepare Render Directories
        run: |
          mkdir -p renders/scenes
          mkdir -p renders/final
          mkdir -p renders/qc

      - name: Build & Render Assigned Scenes
        env:
          SCENE_FILTER: ${{ matrix.scenes }}
          RENDER_ENGINE: ${{ github.event.inputs.render_engine || 'BLENDER_EEVEE_NEXT' }}
          RENDER_SAMPLES: ${{ github.event.inputs.samples || '8' }}
        run: |
          echo "================================"
          echo "GROUP: ${{ matrix.chunk }}"
          echo "SCENES: $SCENE_FILTER"
          echo "================================"

          xvfb-run -a blender \
            --background \
            --python scripts/render_scenes.py

      - name: Upload Group Render Results
        uses: actions/upload-artifact@v4
        with:
          name: rendered-scenes-${{ matrix.chunk }}
          path: renders/scenes/*.mp4
          if-no-files-found: error
          retention-days: 1

  merge-video:
    name: Merge All Scenes & Finalize Video
    runs-on: ubuntu-latest
    needs: render-video
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download All Group Results
        uses: actions/download-artifact@v4
        with:
          pattern: rendered-scenes-*
          path: renders/scenes
          merge-multiple: true

      - name: Verify All 10 Scenes
        run: |
          echo "Checking rendered scenes..."

          for i in $(seq -w 1 10); do
            file="renders/scenes/scene_${i}.mp4"

            if [ ! -s "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi

            echo "FOUND: $file"
          done

          echo "All 10 scenes are ready."

      - name: Mix Audio & Concatenate Scenes
        run: |
          chmod +x scripts/mix_audio.sh
          bash scripts/mix_audio.sh

      - name: Quality Control
        run: |
          mkdir -p renders/final renders/qc

          ffprobe -v error \
            -show_entries format=duration:stream=codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,nb_frames \
            -of default=nw=1 \
            renders/final/jakarta_lowpoly_1080x1920.mp4

          ffmpeg -y \
            -i renders/final/jakarta_lowpoly_1080x1920.mp4 \
            -vf "fps=1/5,scale=540:-1" \
            renders/qc/preview_%02d.png

      - name: Upload Final MP4 & QC Frames
        uses: actions/upload-artifact@v4
        with:
          name: jakarta-lowpoly-3d-1080x1920
          path: |
            renders/final/jakarta_lowpoly_1080x1920.mp4
            renders/qc/*.png
          if-no-files-found: error
          retention-days: 14
