          mkdir -p "$GITHUB_WORKSPACE/renders/final"
          mkdir -p "$GITHUB_WORKSPACE/renders/qc"
          test -f scripts/render_scenes.py || {
            echo "ERROR: scripts/render_scenes.py tidak ditemukan"
            exit 1
          }

      - name: Build & Render Assigned Scenes
        env:
          SCENE_FILTER: ${{ matrix.scenes }}
          RENDER_ENGINE: ${{ inputs.render_engine || 'BLENDER_EEVEE_NEXT' }}
          RENDER_SAMPLES: ${{ inputs.samples || '8' }}
          RENDER_OUTPUT_DIR: ${{ github.workspace }}/renders/scenes
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          echo "================================"
          echo "GROUP: ${{ matrix.chunk }}"
          echo "SCENES: $SCENE_FILTER"
          echo "OUTPUT: $RENDER_OUTPUT_DIR"
          echo "================================"

          xvfb-run -a blender \
            --background \
            --python "$GITHUB_WORKSPACE/scripts/render_scenes.py"

          echo "=== MP4 FILES AFTER BLENDER ==="
          find "$RENDER_OUTPUT_DIR" -maxdepth 1 -type f -iname '*.mp4' -printf '%f (%s bytes)\n'

          count=$(find "$RENDER_OUTPUT_DIR" -maxdepth 1 -type f -iname '*.mp4' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "ERROR: Blender selesai tetapi tidak menghasilkan MP4."
            echo "Periksa log START RENDER / MP4 TARGET dari script Python."
            exit 1
          fi

      # Selalu unggah hasil parsial untuk membantu diagnosis jika render gagal.
      - name: Upload Group Render Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-scenes-${{ matrix.chunk }}
          path: renders/scenes/*.mp4
          if-no-files-found: warn
          retention-days: 1

  merge-video:
    name: Merge All Scenes & Finalize Video
    runs-on: ubuntu-latest
    needs: render-video
    if: needs.render-video.result == 'success'
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download All Group Results
        uses: actions/download-artifact@v4
        with:
          pattern: rendered-scenes-*
          path: renders/scenes
          merge-multiple: true

      - name: Verify All 10 Scenes
        run: |
          set -euo pipefail
          echo "Checking rendered scenes..."

          for i in $(seq -w 1 10); do
            file="renders/scenes/scene_${i}.mp4"

            if [ ! -s "$file" ]; then
              echo "ERROR: Missing or empty $file"
              echo "Available MP4 files:"
              find renders/scenes -maxdepth 1 -type f -name '*.mp4' -print
              exit 1
            fi

            echo "FOUND: $file"
          done

          echo "All 10 scenes are ready."

      - name: Mix Audio & Concatenate Scenes
        run: |
          chmod +x scripts/mix_audio.sh
          bash scripts/mix_audio.sh

      - name: Quality Control
        run: |
          set -euo pipefail
          mkdir -p renders/final renders/qc

          test -s renders/final/jakarta_lowpoly_1080x1920.mp4

          ffprobe -v error \
            -show_entries format=duration:stream=codec_type,codec_name,width,height,r_frame_rate,avg_frame_rate,nb_frames \
            -of default=nw=1 \
            renders/final/jakarta_lowpoly_1080x1920.mp4

          ffmpeg -y \
            -i renders/final/jakarta_lowpoly_1080x1920.mp4 \
            -vf "fps=1/5,scale=540:-1" \
            renders/qc/preview_%02d.png

      - name: Upload Final MP4 & QC Frames
        uses: actions/upload-artifact@v4
        with:
          name: jakarta-lowpoly-3d-1080x1920
          path: |
            renders/final/jakarta_lowpoly_1080x1920.mp4
            renders/qc/*.png
          if-no-files-found: error
          retention-days: 14
