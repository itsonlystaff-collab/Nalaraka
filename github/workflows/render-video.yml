name: Render Video

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Render MP4 (1080x1920, 60 fps, 30 detik)
        run: npx remotion render src/index.ts VideoShort out/video.mp4 --concurrency=4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-1080x1920-60fps
          path: out/video.mp4
          retention-days: 14
